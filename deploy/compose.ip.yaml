services:
  caddy:
    environment:
      VS_PUBLIC_HOST: ${VS_PUBLIC_HOST:?set VS_PUBLIC_HOST in deploy/.env}
    volumes:
      - ./relay/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - ${VS_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${VS_ACME_WEBROOT:-/var/lib/voice-satellite/acme}:/srv/acme:ro
