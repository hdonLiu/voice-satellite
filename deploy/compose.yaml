name: voice-satellite

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay/Dockerfile
    env_file:
      - ${VS_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    environment:
      VS_DOMAIN: ${VS_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./relay/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
