name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production Relay image
        run: docker build --file deploy/relay/Dockerfile --tag voice-satellite-relay:ci .
      - name: Build whisper.cpp runtime image
        run: docker build --file deploy/whisper/Dockerfile --tag voice-satellite-whisper-runtime:ci .
      - name: Validate Compose configuration
        env:
          VS_ENV_FILE: .env.example
        run: |
          docker compose --env-file deploy/.env.example \
            --file deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env.example \
            --file deploy/compose.yaml --file deploy/compose.whisper.yaml \
            config --quiet

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        profile: [ptt, wakenet]
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        working-directory: devices/esp32
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          if [[ "${{ matrix.profile }}" == "wakenet" ]]; then
            idf.py -DVS_FIRMWARE_PROFILE=wakenet \
              -D'SDKCONFIG_DEFAULTS=sdkconfig.defaults;profiles/wakenet/sdkconfig.defaults' \
              build
          else
            idf.py build
          fi
      - name: Merge flashable firmware image
        working-directory: devices/esp32
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py merge-bin -o "build/voice-satellite-${{ matrix.profile }}.bin"
      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: devices/esp32/build/voice-satellite-${{ matrix.profile }}.bin
          if-no-files-found: error
          retention-days: 7
