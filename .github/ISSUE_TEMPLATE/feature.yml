name: Feature proposal
description: Propose a scoped improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Module and protocol impact
      description: Which ports, adapters, schemas, or trust boundaries change?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require a cc-connect compatibility layer.
          required: true
